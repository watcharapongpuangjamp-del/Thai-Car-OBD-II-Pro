name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Check for Secrets
      shell: bash
      run: |
        set -euo pipefail
        # Hyphen is last in the character class to avoid an invalid regex range.
        if grep -rnE --exclude-dir=.git 'AIza[0-9A-Za-z_-]{35}' ./app; then
          echo "Error: A hardcoded Google API key pattern was found."
          exit 1
        fi

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Run Unit Tests
      run: gradle testDebugUnitTest --no-daemon

    - name: Run Lint
      run: gradle lintDebug --no-daemon
